<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMelec Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    .custom-gradient { background: linear-gradient(135deg, #0098E0 0%, #00537A 100%); }
    .btn-active { background: linear-gradient(to bottom, #0098E0 0%, #00537A 100%) !important; }
    .input-border { border: 2px solid #E5E7EB; }
    .input-error { border: 2px solid #D33131 !important; }
</style>
</head>
<body class="bg-white h-screen overflow-hidden font-sans">

    <div id="dimOverlay" class="hidden fixed inset-0 bg-black/50 z-40 transition-opacity duration-500"></div>

    <div id="successToast" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 w-full max-w-sm bg-white p-8 rounded-[2.5rem] shadow-2xl text-center">
        <div class="flex justify-center mb-4">
            <div class="bg-[#3AB795] rounded-full p-3">
                <svg class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>
        <h2 id="successTitle" class="text-2xl font-bold text-gray-800">Login Success</h2>
        <p id="successSub" class="text-base text-gray-500 mt-2">Welcome back!</p>
    </div>

    <div class="flex flex-col md:flex-row h-screen w-full">
        <div class="custom-gradient w-full md:w-2/3 flex items-center justify-center p-8 h-2/5 md:h-full">
            <img src="images/COSELLOGO.png" alt="Logo" class="w-40 md:w-56 lg:w-60 h-auto drop-shadow-2xl">
        </div>

        <div class="w-full md:w-1/3 p-6 md:p-10 lg:p-12 flex flex-col justify-center bg-white h-3/5 md:h-full shadow-2xl">
            <div class="max-w-md mx-auto w-full">
                
                <div class="text-center mb-6">
                    <h1 class="text-4xl font-bold text-gray-800">Welcome!</h1>
                    <p class="text-gray-500 mt-3 text-lg">Please log in using your UMak account</p>
                </div>

                <div id="errorToast" class="hidden mb-6 flex items-center bg-[#F3F4F6] border-l-4 border-[#D33131] p-4 rounded-xl shadow-lg transition-all">
                    <div class="bg-[#D33131] rounded-full p-1"><svg class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg></div>
                    <div class="ml-3">
                        <p class="text-sm text-gray-800 font-bold leading-none">Login Error</p>
                        <p class="text-xs text-gray-500 mt-1">Invalid credentials. Please try again.</p>
                    </div>
                </div>

                <form id="loginForm" class="space-y-4" novalidate>
                    <div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002 -2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                            </span>
                            <input type="email" id="emailInput" placeholder="Email" 
                                class="input-border w-full pl-12 pr-4 py-4 rounded-2xl focus:outline-none text-lg bg-white transition-all">
                        </div>
                        <p id="emailError" class="hidden text-[#D33131] text-xs mt-1 ml-4 font-bold italic">Field is required</p>
                    </div>

                    <div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </span>
                            
                            <input type="password" id="password" placeholder="Password" 
                                class="input-border w-full pl-12 pr-12 py-4 rounded-2xl focus:outline-none text-lg bg-white transition-all">
                            
                            <span id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer z-10">
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </span>
                        </div>
                        <p id="passwordError" class="hidden text-[#D33131] text-xs mt-1 ml-4 font-bold italic">Field is required</p>
                    </div>

                    <div class="text-center">
                        <a href="Leader-ForgotPassword.html" class="text-sm font-bold text-[#0077B6] underline underline-offset-4">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit" id="loginBtn" disabled
                        class="w-full bg-gray-400 text-white font-bold py-4 rounded-2xl cursor-not-allowed transition-all mt-4 text-xl shadow-lg">
                        Log In
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
