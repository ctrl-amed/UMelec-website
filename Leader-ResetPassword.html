<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMelec - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/ui-system.css" rel="stylesheet">
    <style>
        .custom-gradient { background: linear-gradient(135deg, #0098E0 0%, #00537A 100%); }
        .btn-active { background: linear-gradient(to bottom, #0098E0 0%, #00537A 100%) !important; }
        .input-border { border: 2px solid #E5E7EB; }
        .valid-text { color: #27A688; }
        .invalid-text { color: #D33131; }
        .default-text { color: #9CA3AF; }
        
        .floating-label {
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }
        input:focus + .floating-label,
        input:not(:placeholder-shown) + .floating-label {
            top: 0;
            font-size: 0.75rem;
            background: white;
            padding: 0 4px;
            color: #6B7280;
        }
    </style>
</head>
<body class="bg-white h-screen overflow-hidden font-sans">

    <div id="dimOverlay" class="hidden fixed inset-0 bg-black/50 z-40 transition-opacity duration-500"></div>
    <div id="successDialog" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 w-[90%] max-w-sm bg-white p-8 rounded-[2.5rem] shadow-2xl text-center">
        <div class="flex justify-center mb-4">
            <div class="bg-[#3AB795] rounded-full p-3">
                <svg class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7" /></svg>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Reset password successfully!</h2>
        <p class="text-base text-gray-500 mt-2">Your password has been updated.</p>
        <button onclick="window.location.href='index.html'" class="w-full btn-active text-white font-bold py-3 rounded-full mt-6 text-lg">Continue to Login</button>
    </div>

    <div class="flex flex-col md:flex-row h-screen w-full">
        <div class="custom-gradient w-full md:w-2/3 flex items-center justify-center p-8 h-2/5 md:h-full">
            <img src="images/COSELLOGO.png" alt="Logo" class="w-40 md:w-56 lg:w-60 h-auto drop-shadow-2xl">
        </div>

        <div class="w-full md:w-1/3 p-6 md:p-10 lg:p-12 flex flex-col justify-center bg-white h-3/5 md:h-full shadow-2xl overflow-y-auto">
            <div class="max-w-md mx-auto w-full">
                <h1 class="text-3xl font-bold text-gray-800 text-center mb-10">Reset Password</h1>

                <div class="space-y-6">
                    <div class="relative">
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </span>
                            <input type="password" id="newPassword" placeholder=" " class="input-border w-full pl-12 pr-12 py-3.5 rounded-2xl focus:outline-none text-base">
                            <label class="floating-label absolute left-12 text-gray-400">Password</label>
                            
                            <span class="toggle-password absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer z-10">
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </span>
                        </div>
                        <div id="passwordCriteria" class="hidden mt-3 space-y-1 pl-4">
                            <p id="length" class="text-xs default-text"><span>•</span> Must be at least 8 characters</p>
                            <p id="case" class="text-xs default-text"><span>•</span> Mixed case</p>
                            <p id="special" class="text-xs default-text"><span>•</span> Must contain a special character</p>
                            <p id="number" class="text-xs default-text"><span>•</span> Must contain a number</p>
                        </div>
                    </div>

                    <div class="relative">
                        <div class="relative flex items-center">
                            <span class="absolute left-4 text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </span>
                            <input type="password" id="confirmPassword" placeholder=" " class="input-border w-full pl-12 pr-12 py-3.5 rounded-2xl focus:outline-none text-base">
                            <label class="floating-label absolute left-12 text-gray-400">Confirm Password</label>
                            
                            <span class="toggle-password absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer z-10">
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </span>
                        </div>
                        <div id="matchCriteria" class="hidden mt-3 pl-4">
                            <p id="match" class="text-xs default-text"><span>•</span> Password must match</p>
                        </div>
                    </div>

                    <button id="resetBtn" disabled class="w-full bg-gray-400 text-white font-bold py-3.5 rounded-2xl transition-all text-lg shadow-lg cursor-not-allowed mt-4">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/Leader-Reset.js"></script>
</body>
</html>
