<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMelec - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-gradient { background: linear-gradient(135deg, #0098E0 0%, #00537A 100%); }
        .btn-active { background: linear-gradient(to bottom, #0098E0 0%, #00537A 100%) !important; }
        .input-border { border: 1px solid #E5E7EB; }
        .input-error { border: 1.5px solid #D33131 !important; }
        
        /* Floating Label Logic */
        .floating-label {
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }
        input:focus + .floating-label,
        input:not(:placeholder-shown) + .floating-label {
            top: 0;
            font-size: 0.75rem;
            background: white;
            padding: 0 4px;
            color: #6B7280;
        }
    </style>
</head>
<body class="bg-white h-screen overflow-hidden font-sans">

    <div class="flex flex-col md:flex-row h-screen w-full">
        <div class="custom-gradient w-full md:w-2/3 flex items-center justify-center p-8 h-2/5 md:h-full">
            <img src="images/COSELLOGO.png" alt="Logo" class="w-40 md:w-56 lg:w-60 h-auto drop-shadow-2xl">
        </div>

        <div class="w-full md:w-1/3 p-6 md:p-10 lg:p-12 flex flex-col justify-center bg-white h-3/5 md:h-full shadow-2xl">
            <div class="max-w-md mx-auto w-full">
                
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-bold text-gray-800">Forgot Password</h1>
                    <p class="text-gray-500 mt-4 text-sm leading-relaxed">
                        Please provide your UMak email account
                    </p>
                </div>

                <form id="forgotPasswordForm" class="space-y-6" novalidate> <div class="relative group">
        <div class="relative flex items-center">
            <span class="absolute left-4 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002 -2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </span>
            <input type="email" id="emailInput" placeholder=" " 
                class="input-border w-full pl-12 pr-4 py-3.5 rounded-2xl focus:outline-none text-base bg-white transition-all">
            <label class="floating-label absolute left-12 text-gray-400">Email</label>
        </div>

        <div id="errorToast" class="hidden mt-6 flex items-center bg-[#F3F4F6] border-l-4 border-[#D33131] p-3 rounded-xl shadow-md transition-all">
            <div class="bg-[#D33131] rounded-full p-1">
                <svg class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-xs text-gray-800 font-bold leading-none">Email Error</p>
                <p class="text-[10px] text-gray-500 mt-1">Email does not exist.</p>
            </div>
        </div>
    </div>

    <button type="submit" id="submitBtn" disabled
        class="w-full bg-gray-400 text-white font-bold py-3.5 rounded-2xl transition-all mt-4 text-lg shadow-lg cursor-not-allowed">
        Send Verification
    </button>
</form>
            </div>
        </div>
    </div>

<script type="module" src="js/Leader-FP.js"></script>
</body>
</html>
