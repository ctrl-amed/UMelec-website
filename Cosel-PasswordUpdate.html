<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMelec - Password Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/ui-system.css" rel="stylesheet">
    <style>
        .custom-gradient { background: linear-gradient(135deg, #0098E0 0%, #00537A 100%); }
        .btn-active { background: linear-gradient(to bottom, #0098E0 0%, #00537A 100%) !important; }
        .input-border { border: 2px solid #E5E7EB; }
        .input-error { border: 2px solid #D33131 !important; }
        .valid-text { color: #27A688; }
        .invalid-text { color: #9CA3AF; }
        .error-text { color: #D33131; }
    </style>
</head>
<body class="bg-white h-screen overflow-hidden font-sans">

    <div id="dimOverlay" class="hidden fixed inset-0 bg-black/50 z-40 transition-opacity duration-500"></div>
    <div id="successToast" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 w-full max-w-sm bg-white p-8 rounded-[2.5rem] shadow-2xl text-center">
        <div class="flex justify-center mb-4">
            <div class="bg-[#3AB795] rounded-full p-3">
                <svg class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7" /></svg>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Password Secured!</h2>
        <p class="text-base text-gray-500 mt-2">Welcome to the UMelec Adviser Portal.</p>
    </div>

    <div class="flex flex-col md:flex-row h-screen w-full">
        <div class="custom-gradient w-full md:w-2/3 flex items-center justify-center p-8 h-2/5 md:h-full">
            <img src="images/COSELLOGO.png" alt="Logo" class="w-40 md:w-56 lg:w-60 h-auto drop-shadow-2xl">
        </div>

        <div class="w-full md:w-1/3 p-6 md:p-10 lg:p-12 flex flex-col justify-center bg-white h-3/5 md:h-full shadow-2xl overflow-y-auto">
            <div class="max-w-md mx-auto w-full">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-gray-800">Password Update</h1>
                    <p class="text-gray-500 mt-4 text-sm">Set a permanent password to secure your account.</p>
                </div>

                <div id="errorToast" class="hidden mb-4 flex items-center bg-[#F3F4F6] border-l-4 border-[#D33131] p-4 rounded-xl shadow-md">
                    <div class="bg-[#D33131] rounded-full p-1"><svg class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg></div>
                    <div class="ml-3"><p class="text-sm text-gray-800 font-bold">Old password mismatch.</p></div>
                </div>

                <form id="updatePasswordForm" class="space-y-4">
                    <div class="relative">
                        <input type="password" id="oldPassword" placeholder="Old Password" class="input-border w-full pl-6 pr-12 py-3 rounded-2xl focus:outline-none bg-white transition-all">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer z-10"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg></span>
                    </div>

                    <div>
                        <div class="relative">
                            <input type="password" id="newPassword" placeholder="New Password" class="input-border w-full pl-6 pr-12 py-3 rounded-2xl focus:outline-none bg-white transition-all">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer z-10"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg></span>
                        </div>
                        <div id="newPasswordValidations" class="hidden mt-3 ml-2 space-y-1 text-xs font-medium">
                            <p id="v-length" class="invalid-text"><span>•</span> Must be at least 8 characters</p>
                            <p id="v-case" class="invalid-text"><span>•</span> Mixed case</p>
                            <p id="v-special" class="invalid-text"><span>•</span> Must contain a special character</p>
                            <p id="v-number" class="invalid-text"><span>•</span> Must contain a number</p>
                        </div>
                    </div>

                    <div>
                        <div class="relative">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" class="input-border w-full pl-6 pr-12 py-3 rounded-2xl focus:outline-none bg-white transition-all">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 cursor-pointer z-10"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg></span>
                        </div>
                        <p id="v-match" class="hidden mt-2 ml-2 text-xs font-medium invalid-text"><span>•</span> Password must match</p>
                    </div>

                    <button type="submit" id="submitBtn" disabled class="w-full bg-gray-400 text-white font-bold py-3 rounded-2xl transition-all mt-6 text-lg shadow-lg cursor-not-allowed">
                        Set New Password
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="js/Cosel-PU.js"></script>
</body>
</html>
